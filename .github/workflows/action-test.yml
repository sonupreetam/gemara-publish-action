name: Action Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish to local registry
        id: publish
        uses: ./
        with:
          file: testdata/minimal-catalog.yaml
          license: Apache-2.0
          registry: localhost:5000
          repository: test/catalog
          tag: latest
          username: test
          password: test
          validate: "false"
          sign_source: "false"
          verify_source: "false"

      - name: Verify outputs
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_REF: ${{ steps.publish.outputs.source_ref }}
          SOURCE_DIGEST: ${{ steps.publish.outputs.source_digest }}
          TRUST_MODE: ${{ steps.publish.outputs.trust_mode }}
          VERIFIED_SOURCE: ${{ steps.publish.outputs.verified_source }}
          VERIFIED_DESTINATION: ${{ steps.publish.outputs.verified_destination }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" || ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid digest: ${DIGEST}"
            exit 1
          fi
          if [[ "${SOURCE_REF}" != "localhost:5000/test/catalog@${DIGEST}" ]]; then
            echo "::error::source_ref mismatch: got ${SOURCE_REF}"
            exit 1
          fi
          if [[ -z "${SOURCE_DIGEST}" || "${SOURCE_DIGEST}" != "${DIGEST}" ]]; then
            echo "::error::source_digest mismatch or empty: got ${SOURCE_DIGEST}, expected ${DIGEST}"
            exit 1
          fi
          if [[ "${TRUST_MODE}" != "resign" ]]; then
            echo "::error::Expected trust_mode=resign, got ${TRUST_MODE}"
            exit 1
          fi
          if [[ "${VERIFIED_SOURCE}" != "skipped" ]]; then
            echo "::error::Expected verified_source=skipped (signing disabled), got ${VERIFIED_SOURCE}"
            exit 1
          fi
          if [[ "${VERIFIED_DESTINATION}" != "skipped" ]]; then
            echo "::error::Expected verified_destination=skipped (no promotion), got ${VERIFIED_DESTINATION}"
            exit 1
          fi
          echo "All outputs verified"

      - name: Verify manifest on registry
        run: |
          set -euo pipefail
          oras manifest fetch localhost:5000/test/catalog:latest | python3 -c "
          import sys, json
          m = json.load(sys.stdin)
          assert m['artifactType'] == 'application/vnd.gemara.bundle.v1', f'bad artifactType: {m[\"artifactType\"]}'
          assert m['config']['mediaType'] == 'application/vnd.gemara.manifest.v1+json', 'bad config mediaType'
          assert len(m['layers']) > 0, 'no layers'
          assert m['layers'][0]['mediaType'] == 'application/vnd.gemara.artifact.v1+yaml', 'bad layer mediaType'
          assert 'Apache-2.0' in m.get('annotations', {}).get('org.opencontainers.image.licenses', ''), 'missing license'
          print('Manifest structure verified')
          "

  version-flag:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish versionless catalog with version input
        id: publish
        uses: ./
        with:
          file: testdata/minimal-catalog-no-version.yaml
          license: Apache-2.0
          version: "0.1.0-test"
          registry: localhost:5000
          repository: test/catalog-versioned
          tag: v0.1.0-test
          username: test
          password: test
          validate: "false"
          sign_source: "false"
          verify_source: "false"

      - name: Verify outputs
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_REF: ${{ steps.publish.outputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" || ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid digest: ${DIGEST}"
            exit 1
          fi
          if [[ "${SOURCE_REF}" != "localhost:5000/test/catalog-versioned@${DIGEST}" ]]; then
            echo "::error::source_ref mismatch: got ${SOURCE_REF}"
            exit 1
          fi
          echo "Version-flag outputs verified"

      - name: Verify manifest has correct version in config
        run: |
          set -euo pipefail
          oras manifest fetch localhost:5000/test/catalog-versioned:v0.1.0-test | python3 -c "
          import sys, json
          m = json.load(sys.stdin)
          assert m['artifactType'] == 'application/vnd.gemara.bundle.v1', f'bad artifactType: {m[\"artifactType\"]}'
          assert len(m['layers']) > 0, 'no layers'
          assert 'Apache-2.0' in m.get('annotations', {}).get('org.opencontainers.image.licenses', ''), 'missing license'
          print('Version-flag manifest verified')
          "
          # Assert the stamped version on the packed YAML layer itself — the
          # documented contract for the version input — not a substring match
          # over the serialized config (which any field could satisfy).
          dir="$(mktemp -d)"
          oras pull "localhost:5000/test/catalog-versioned:v0.1.0-test" -o "$dir"
          pulled="$(find "$dir" -name '*.yaml' | head -1)"
          [[ -n "${pulled}" ]] || { echo "::error::No YAML layer in pulled artifact"; ls -la "$dir"; exit 1; }
          python3 - "$pulled" << 'PY'
          import sys, yaml
          doc = yaml.safe_load(open(sys.argv[1]))
          version = (doc or {}).get("metadata", {}).get("version")
          assert version == "0.1.0-test", f"expected metadata.version == '0.1.0-test', got {version!r}"
          print("Version stamp verified on the packed YAML layer")
          PY

  tag-rescue:
    runs-on: ubuntu-latest
    # Third branch of the version precedence chain: a versionless YAML with
    # NO version input gets the tag stamped as metadata.version (publish.sh
    # passes the tag as --version only when the YAML omits metadata.version).
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish versionless catalog with tag only (no version input)
        id: publish
        uses: ./
        with:
          file: testdata/minimal-catalog-no-version.yaml
          license: Apache-2.0
          registry: localhost:5000
          repository: test/tag-rescue
          tag: v9.9.9
          username: test
          password: test
          validate: "false"
          sign_source: "false"
          verify_source: "false"

      - name: Assert the tag rescued the versionless YAML
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          oras pull "localhost:5000/test/tag-rescue:v9.9.9" -o "$dir"
          pulled="$(find "$dir" -name '*.yaml' | head -1)"
          [[ -n "${pulled}" ]] || { echo "::error::No YAML layer in pulled artifact"; ls -la "$dir"; exit 1; }
          python3 - "$pulled" << 'PY'
          import sys, yaml
          doc = yaml.safe_load(open(sys.argv[1]))
          version = (doc or {}).get("metadata", {}).get("version")
          assert version == "v9.9.9", f"expected the tag v9.9.9 to rescue metadata.version, got {version!r}"
          print("Tag rescue verified: the tag supplies metadata.version for a versionless YAML")
          PY

  input-validation:
    runs-on: ubuntu-latest
    # Local registry so the validate-without-spec test fails for the right
    # reason: with reachable credentials the publish step would succeed,
    # leaving the Validate step as the only possible failure.
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test missing license (should fail)
        id: missing-license
        uses: ./
        continue-on-error: true
        with:
          file: testdata/minimal-catalog.yaml
          license: ""
          repository: test/repo
          tag: latest
          password: dummy

      - name: Assert missing license was rejected
        if: always()
        run: |
          if [[ "${{ steps.missing-license.outcome }}" != "failure" ]]; then
            echo "::error::Expected action to fail when license is empty, got: ${{ steps.missing-license.outcome }}"
            exit 1
          fi
          echo "Correctly rejected missing license"

      - name: Test missing password (should fail)
        id: missing-password
        uses: ./
        continue-on-error: true
        with:
          file: testdata/minimal-catalog.yaml
          license: Apache-2.0
          repository: test/repo
          tag: latest
          password: ""

      - name: Assert missing password was rejected
        if: always()
        run: |
          if [[ "${{ steps.missing-password.outcome }}" != "failure" ]]; then
            echo "::error::Expected action to fail when password is empty, got: ${{ steps.missing-password.outcome }}"
            exit 1
          fi
          echo "Correctly rejected missing password"

      - name: Test invalid trust_mode (should fail)
        id: bad-trust
        uses: ./
        continue-on-error: true
        with:
          file: testdata/minimal-catalog.yaml
          license: Apache-2.0
          repository: test/repo
          tag: latest
          password: dummy
          trust_mode: "invalid"

      - name: Assert invalid trust_mode was rejected
        if: always()
        run: |
          if [[ "${{ steps.bad-trust.outcome }}" != "failure" ]]; then
            echo "::error::Expected action to fail with invalid trust_mode, got: ${{ steps.bad-trust.outcome }}"
            exit 1
          fi
          echo "Correctly rejected invalid trust_mode"

      - name: Test promote without destination (should fail)
        id: promote-no-dest
        uses: ./
        continue-on-error: true
        with:
          file: testdata/minimal-catalog.yaml
          license: Apache-2.0
          repository: test/repo
          tag: latest
          password: dummy
          promote_to_destination: "true"
          destination_registry: ""
          destination_repository: ""
          destination_username: ""
          destination_password: ""

      - name: Assert promote without destination was rejected
        if: always()
        run: |
          if [[ "${{ steps.promote-no-dest.outcome }}" != "failure" ]]; then
            echo "::error::Expected action to fail when promote_to_destination=true without destination fields, got: ${{ steps.promote-no-dest.outcome }}"
            exit 1
          fi
          echo "Correctly rejected promote without destination"

      - name: Test validate without spec dir (should fail)
        id: validate-no-spec
        uses: ./
        continue-on-error: true
        with:
          file: testdata/minimal-catalog.yaml
          license: Apache-2.0
          registry: localhost:5000
          repository: test/validate-no-spec
          tag: latest
          username: test
          password: test
          validate: "true"

      - name: Assert validate without spec dir was rejected
        if: always()
        run: |
          if [[ "${{ steps.validate-no-spec.outcome }}" != "failure" ]]; then
            echo "::error::Expected action to fail when validate=true without gemara_spec_dir, got: ${{ steps.validate-no-spec.outcome }}"
            exit 1
          fi
          echo "Correctly rejected validate without spec dir"

      - name: Checkout Gemara spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gemaraproj/gemara
          path: gemara-spec
          persist-credentials: false

      # Spec scenario "Validation failure": invalid root YAML with
      # validate=true and a spec dir must fail BEFORE pack or push. The
      # registry credentials are valid, so the Validate step is the only
      # possible failure; the assertion also checks nothing was pushed.
      - name: Test schema-validation failure (should fail)
        id: validate-invalid
        uses: ./
        continue-on-error: true
        with:
          file: testdata/invalid-catalog.yaml
          license: Apache-2.0
          registry: localhost:5000
          repository: test/validate-invalid
          tag: latest
          username: test
          password: test
          validate: "true"
          gemara_spec_dir: gemara-spec

      - name: Assert schema-validation failure was rejected before push
        if: always()
        run: |
          set -euo pipefail
          if [[ "${{ steps.validate-invalid.outcome }}" != "failure" ]]; then
            echo "::error::Expected action to fail on invalid YAML with validate=true, got: ${{ steps.validate-invalid.outcome }}"
            exit 1
          fi
          # registry:2 returns 404 for tags/list on a repository that was
          # never pushed to — 200 means something landed despite the failure.
          if curl -sf "http://localhost:5000/v2/test/validate-invalid/tags/list" >/dev/null 2>&1; then
            echo "::error::Something was pushed despite the validation failure"
            exit 1
          fi
          echo "Correctly rejected invalid YAML before pack or push"

      - name: Test working_directory traversal (should fail)
        id: traversal
        uses: ./
        continue-on-error: true
        with:
          file: testdata/minimal-catalog.yaml
          license: Apache-2.0
          repository: test/repo
          tag: latest
          password: dummy
          working_directory: "../../.."

      - name: Assert traversal was rejected
        if: always()
        run: |
          if [[ "${{ steps.traversal.outcome }}" != "failure" ]]; then
            echo "::error::Expected action to fail on working_directory traversal, got: ${{ steps.traversal.outcome }}"
            exit 1
          fi
          echo "Correctly rejected working_directory traversal"

      - name: Test file path escape (should fail)
        id: file-escape
        uses: ./
        continue-on-error: true
        with:
          file: ../../../../../etc/hostname
          license: Apache-2.0
          registry: localhost:5000
          repository: test/file-escape
          tag: latest
          username: test
          password: test

      - name: Assert file path escape was rejected
        if: always()
        run: |
          if [[ "${{ steps.file-escape.outcome }}" != "failure" ]]; then
            echo "::error::Expected action to fail when file resolves outside the workspace, got: ${{ steps.file-escape.outcome }}"
            exit 1
          fi
          echo "Correctly rejected file path escape"

  promotion:
    runs-on: ubuntu-latest
    # Covers the promotion happy path in finalize.sh: ORAS copy, the
    # source/destination digest-match integrity check, the no_sign gate on
    # destination signing/verification, and the promotion output contract
    # (spec: "Promotion outputs emitted"). The only other promotion test
    # covers the failure case (input-validation job).
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish and promote (trust_mode=resign, no_sign)
        id: promote
        uses: ./
        with:
          file: testdata/minimal-catalog.yaml
          license: Apache-2.0
          registry: localhost:5000
          repository: test/promotion-source
          tag: "1.0.0"
          username: test
          password: test
          validate: "false"
          sign_source: "false"
          verify_source: "false"
          no_sign: "true"
          promote_to_destination: "true"
          destination_registry: localhost:5000
          destination_repository: test/promotion-dest
          destination_tag: "1.0.0"
          destination_username: test
          destination_password: test
          trust_mode: resign

      - name: Assert promotion outputs and digest match
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
          DEST_REF: ${{ steps.promote.outputs.destination_ref }}
          DEST_DIGEST: ${{ steps.promote.outputs.destination_digest }}
          VERIFIED_DEST: ${{ steps.promote.outputs.verified_destination }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Invalid source digest: ${DIGEST}"; exit 1; }
          [[ "${DEST_DIGEST}" == "${DIGEST}" ]] || {
            echo "::error::destination_digest does not match source digest: ${DEST_DIGEST} vs ${DIGEST}"
            exit 1
          }
          [[ "${DEST_REF}" == "localhost:5000/test/promotion-dest@${DIGEST}" ]] || {
            echo "::error::destination_ref mismatch: got ${DEST_REF}"
            exit 1
          }
          [[ "${VERIFIED_DEST}" == "skipped" ]] || {
            echo "::error::expected verified_destination=skipped with no_sign=true, got ${VERIFIED_DEST}"
            exit 1
          }
          echo "Promotion outputs verified: digest match, destination_ref correct, verification skipped (no_sign)"

      - name: Assert promoted content is the same bundle
        run: |
          set -euo pipefail
          src_dir="$(mktemp -d)"; dst_dir="$(mktemp -d)"
          oras pull "localhost:5000/test/promotion-source:1.0.0" -o "$src_dir"
          oras pull "localhost:5000/test/promotion-dest:1.0.0" -o "$dst_dir"
          src_yaml="$(find "$src_dir" -name '*.yaml' | head -1)"
          dst_yaml="$(find "$dst_dir" -name '*.yaml' | head -1)"
          [[ -n "${src_yaml}" && -n "${dst_yaml}" ]] || { echo "::error::missing YAML layer"; exit 1; }
          diff "${src_yaml}" "${dst_yaml}"
          grep -q 'version: "0.0.1"' "${dst_yaml}" || {
            echo "::error::promoted bundle lost the YAML's version"; cat "${dst_yaml}"; exit 1
          }
          echo "Promoted bundle is byte-identical content to the source"

  promotion-copy-only:
    runs-on: ubuntu-latest
    # Covers the copy-only arm of the trust_mode case statement in
    # finalize.sh (plain oras copy, no resign semantics).
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish and promote (trust_mode=copy-only)
        id: promote
        uses: ./
        with:
          file: testdata/minimal-catalog.yaml
          license: Apache-2.0
          registry: localhost:5000
          repository: test/promo-copy-source
          tag: "1.0.0"
          username: test
          password: test
          validate: "false"
          sign_source: "false"
          verify_source: "false"
          no_sign: "true"
          promote_to_destination: "true"
          destination_registry: localhost:5000
          destination_repository: test/promo-copy-dest
          destination_tag: "1.0.0"
          destination_username: test
          destination_password: test
          trust_mode: copy-only
          # Plain oras copy carries no signatures and nothing is signed
          # (no_sign), so there is nothing to verify on the destination —
          # the finalize no_sign skip gate deliberately excludes copy-only.
          sign_destination: "false"
          verify_destination: "false"

      - name: Assert copy-only promotion outputs
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
          DEST_DIGEST: ${{ steps.promote.outputs.destination_digest }}
          VERIFIED_DEST: ${{ steps.promote.outputs.verified_destination }}
        run: |
          set -euo pipefail
          [[ "${DEST_DIGEST}" == "${DIGEST}" ]] || {
            echo "::error::destination_digest does not match source digest: ${DEST_DIGEST} vs ${DIGEST}"
            exit 1
          }
          [[ "${VERIFIED_DEST}" == "skipped" ]] || {
            echo "::error::expected verified_destination=skipped with no_sign=true, got ${VERIFIED_DEST}"
            exit 1
          }
          oras manifest fetch "localhost:5000/test/promo-copy-dest@${DEST_DIGEST}" >/dev/null
          echo "copy-only promotion verified: digest match and manifest resolvable"

  promotion-copy-referrers:
    runs-on: ubuntu-latest
    # Covers the copy-referrers arm of the trust_mode case statement in
    # finalize.sh (oras copy --recursive): the only arm where carrying
    # signature referrers across registries actually matters.
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish and promote (trust_mode=copy-referrers)
        id: promote
        uses: ./
        with:
          file: testdata/minimal-catalog.yaml
          license: Apache-2.0
          registry: localhost:5000
          repository: test/promo-referrers-source
          tag: "1.0.0"
          username: test
          password: test
          validate: "false"
          sign_source: "false"
          verify_source: "false"
          no_sign: "true"
          promote_to_destination: "true"
          destination_registry: localhost:5000
          destination_repository: test/promo-referrers-dest
          destination_tag: "1.0.0"
          destination_username: test
          destination_password: test
          trust_mode: copy-referrers
          # The source is unsigned in this job (no_sign), so no referrers
          # exist to copy and nothing to verify on the destination — this
          # job covers the --recursive copy arm and the output contract.
          sign_destination: "false"
          verify_destination: "false"

      - name: Assert copy-referrers promotion outputs
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
          DEST_DIGEST: ${{ steps.promote.outputs.destination_digest }}
          VERIFIED_DEST: ${{ steps.promote.outputs.verified_destination }}
        run: |
          set -euo pipefail
          [[ "${DEST_DIGEST}" == "${DIGEST}" ]] || {
            echo "::error::destination_digest does not match source digest: ${DEST_DIGEST} vs ${DIGEST}"
            exit 1
          }
          [[ "${VERIFIED_DEST}" == "skipped" ]] || {
            echo "::error::expected verified_destination=skipped with no_sign=true, got ${VERIFIED_DEST}"
            exit 1
          }
          oras manifest fetch "localhost:5000/test/promo-referrers-dest@${DEST_DIGEST}" >/dev/null
          echo "copy-referrers promotion verified: digest match and manifest resolvable"

  regex-fallback:
    runs-on: ubuntu-latest
    # Tests the layout tag regex extraction path: publish minimal-catalog.yaml
    # (which has metadata.version: "0.0.1") WITHOUT setting the version input,
    # forcing the grep -oE 'oci:.*' fallback in publish.sh.
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish without version input (regex fallback)
        id: publish
        uses: ./
        with:
          file: testdata/minimal-catalog.yaml
          license: Apache-2.0
          registry: localhost:5000
          repository: test/regex-fallback
          tag: latest
          username: test
          password: test
          validate: "false"
          sign_source: "false"
          verify_source: "false"

      - name: Verify outputs
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_REF: ${{ steps.publish.outputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" || ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid digest from regex fallback path: ${DIGEST}"
            exit 1
          fi
          if [[ "${SOURCE_REF}" != "localhost:5000/test/regex-fallback@${DIGEST}" ]]; then
            echo "::error::source_ref mismatch: got ${SOURCE_REF}"
            exit 1
          fi
          echo "Regex fallback path outputs verified"

  version-precedence:
    runs-on: ubuntu-latest
    # Regression test: a YAML that sets metadata.version keeps it even when
    # the caller passes tag: latest — the tag is a rescue for versionless
    # files, never an override.
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish versioned YAML with tag latest
        id: publish
        uses: ./
        with:
          file: testdata/minimal-catalog.yaml
          license: Apache-2.0
          registry: localhost:5000
          repository: test/version-precedence
          tag: latest
          username: test
          password: test
          validate: "false"
          sign_source: "false"
          verify_source: "false"

      - name: Assert the file's version survived the tag
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          oras pull "localhost:5000/test/version-precedence:latest" -o "$dir"
          pulled="$(find "$dir" -name '*.yaml' | head -1)"
          [[ -n "${pulled}" ]] || { echo "::error::No YAML layer in pulled artifact"; ls -la "$dir"; exit 1; }
          grep -q 'version: "0.0.1"' "${pulled}" || {
            echo "::error::Expected the YAML's version 0.0.1 to survive tag: latest"
            cat "${pulled}"; exit 1
          }
          if grep -q 'version: "latest"' "${pulled}"; then
            echo "::error::tag: latest was stamped over the YAML's version"
            exit 1
          fi
          echo "Version precedence verified: the file's version is kept; the tag is only the push label"
