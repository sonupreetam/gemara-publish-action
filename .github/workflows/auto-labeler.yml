---
name: "Auto Labeler"
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
permissions:
  contents: read
jobs:
  auto_labeler:
    # Fork PRs get a read-only token and cannot be labeled.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/auto-labeler.yaml@3e055d5fc59e62419fb3103d96fd116ddcf89c8c # v2.3.0
    with:
      config-name: release-drafter.yml
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
