---
name: "Auto Labeler"
on:
  pull_request_target:
    types: [opened, reopened, edited]
permissions:
  contents: read
jobs:
  auto_labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/auto-labeler.yaml@4bf2f3062f44f0f2461de7c937d7695cf51549a0 # v2.0.0
    with:
      config-name: release-drafter.yml@${{ github.base_ref }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
