name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: YAML syntax (action.yml)
        run: ruby -ryaml -e "YAML.load_file('action.yml'); puts 'action.yml OK'"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install grcli from source
        run: |
          set -euo pipefail
          go install github.com/gemaraproj/grcli@main
          echo "grcli installed: $(grcli --version 2>&1 || echo 'version check skipped')"

      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: latest

      - name: Checkout Gemara spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gemaraproj/gemara
          path: gemara-spec
          persist-credentials: false

      - name: Validate testdata
        run: |
          set -euo pipefail
          cd testdata
          grcli validate -f minimal-catalog.yaml --spec "$GITHUB_WORKSPACE/gemara-spec" 2>&1 | tee /tmp/validate-out.txt
          echo "Validation passed"

      - name: Publish dry run
        run: |
          set -euo pipefail
          cd testdata
          grcli publish -f minimal-catalog.yaml \
            --license Apache-2.0 \
            --dry-run \
            --no-sign \
            --output /tmp/grcli-dry-run 2>&1 | tee /tmp/publish-out.txt
          if [[ ! -d /tmp/grcli-dry-run ]]; then
            echo "::error::Dry-run output directory not created"
            exit 1
          fi
          echo "Dry-run output written to /tmp/grcli-dry-run"
          ls -la /tmp/grcli-dry-run/

      - name: Verify dry-run manifest structure
        run: |
          set -euo pipefail
          test -f /tmp/grcli-dry-run/oci-layout || { echo "::error::Missing oci-layout"; exit 1; }
          test -f /tmp/grcli-dry-run/index.json || { echo "::error::Missing index.json"; exit 1; }
          test -d /tmp/grcli-dry-run/blobs || { echo "::error::Missing blobs directory"; exit 1; }
          grep -qE 'sha256:[a-f0-9]{64}' /tmp/publish-out.txt || { echo "::error::No sha256 digest in output"; exit 1; }
          echo "Manifest structure and digest output verified"

  # TODO: Enable action-test once grcli v0.1.0 is published to ghcr.io/gemaraproj/grcli.
